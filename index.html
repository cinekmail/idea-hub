<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Idea Hub · Hosting Services</title>
<meta name="description" content="Demo app for raising, scoring (WSJF) and tracking improvement ideas, with a guided idea assistant.">

<style>
:root{--accent:#0E5C8C;--accent-dark:#0A4166;--ink:#17212B;--muted:#5B6672;--line:#DDE2E7;--line2:#E3E7EB;--bg:#F2F4F6;--soft:#F8FAFB}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans',system-ui,sans-serif}
a{color:var(--accent)}a:hover{color:var(--accent-dark)}
button{font:inherit}
input,select,textarea{font:inherit;color:var(--ink)}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.mono{font-family:'IBM Plex Mono',monospace}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:1360px;margin:0 auto;padding:32px 24px 48px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px}
.row{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
.main-col{flex:999 1 620px;min-width:0}
.side-col{flex:1 1 300px;min-width:0;display:flex;flex-direction:column;gap:16px}
h1.title{margin:0;font-size:28px;font-weight:700;letter-spacing:-.015em}
.fld{width:100%;min-height:44px;padding:10px 12px;border:1px solid #C9CFD6;border-radius:8px;background:#fff;font-size:15px}
.fld.bad{border-color:#B3261E;background:#FFF8F7}
textarea.fld{resize:vertical;line-height:1.5}
.lbl{display:block;font-size:14px;font-weight:600;margin-bottom:6px}
.req{color:#B3261E}
.hint{font-size:13px;color:var(--muted);margin-top:6px}
.err{font-size:13px;color:#B3261E;margin-top:6px;font-weight:500}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.grid-auto{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px}

/* header */
.top{background:var(--ink);color:#fff}
.top-in{max-width:1360px;margin:0 auto;padding:14px 24px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:center;gap:14px}
.logo{width:40px;height:40px;border-radius:10px;background:var(--accent);display:flex;align-items:center;justify-content:center}
.tabs{display:flex;flex-wrap:wrap;gap:6px;background:#0F171F;padding:4px;border-radius:10px}
.tab{min-height:44px;padding:0 16px;border:0;border-radius:8px;background:transparent;color:#C9D6E2;font-size:15px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.tab:hover{color:#fff;background:#22303D}
.tab.on{background:#fff;color:var(--ink)}
.demo-band{background:#FFF4DE;color:#5C3B00;font-size:13px}
.demo-band .in{max-width:1360px;margin:0 auto;padding:8px 24px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
.linkbtn{all:unset;cursor:pointer;text-decoration:underline;font-weight:600;display:inline-flex;align-items:center;min-height:24px;padding:2px 4px;margin:-2px -4px}
.linkbtn:focus-visible{outline:2px solid var(--accent)}

/* buttons, chips, pills */
.btn{min-height:44px;padding:0 20px;border-radius:8px;border:1px solid transparent;font-size:15px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-dark);color:#fff}
a.btn.primary,a.btn.primary:visited{color:#fff}
.btn.ghost{background:#fff;color:var(--ink);border-color:#C9CFD6}
.btn.ghost:hover{border-color:#8A96A3}
.btn.sm{min-height:38px;font-size:14px;padding:0 14px}
.chip{min-height:40px;padding:0 14px;border:1px solid #C9CFD6;border-radius:999px;background:#fff;color:#2E3A46;font-size:14px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.chip:hover{border-color:#8A96A3}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chip .n{font-family:'IBM Plex Mono',monospace;font-size:12px;opacity:.8}
.chip.qr{border-color:#9DB7CC;color:var(--accent-dark);background:#F3F8FC}
.chip.qr:hover{border-color:var(--accent);background:#E6F0F8}
.pill{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;font-size:13px;font-weight:500;white-space:nowrap}
.pill .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.s-new{background:#E4ECF7;color:#1E3A5F}.s-assessment{background:#FFEFD6;color:#7A4600}.s-progress{background:#D9EFEC;color:#0B524D}.s-closed{background:#E9EBEE;color:#3F4650}
.d-pending{background:#E9EBEE;color:#3F4650}.d-approved{background:#DDF0E2;color:#1C5A2C}.d-hold{background:#FFEFD6;color:#7A4600}.d-rejected{background:#FAE1DD;color:#8E2A1E}
.p-critical{background:#8E2A1E;color:#fff}.p-high{background:#FFE2BF;color:#6E3B00}.p-medium{background:#E4ECF7;color:#1E3A5F}.p-low{background:#E9EBEE;color:#3F4650}.p-none{background:transparent;color:var(--muted);border:1px dashed #B5BDC6}
.sc-hi{background:#1C7A4A}.sc-mid{background:#C47F14}.sc-lo{background:#B3261E}
.num{width:28px;height:28px;padding:0;justify-content:center;flex:none;font-family:'IBM Plex Mono',monospace}

/* dashboard */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px}
.kpi{padding:18px 20px;display:flex;flex-direction:column;gap:6px}
.kpi .v{font-size:34px;font-weight:600;font-family:'IBM Plex Mono',monospace;letter-spacing:-.02em;line-height:1.1}
.toolbar{padding:18px 20px;display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line2)}
.tbl{min-width:1280px}
.tr{display:grid;grid-template-columns:76px 76px minmax(220px,2.4fr) 150px 118px 100px 160px 132px 112px;gap:12px;padding:16px 20px;align-items:center;font-size:14px}
.skip{position:absolute;left:12px;top:-80px;z-index:20;background:#fff;color:var(--ink);padding:10px 16px;border-radius:8px;font-weight:600;box-shadow:0 2px 12px rgba(0,0,0,.2)}
.skip:focus{top:12px}
main:focus{outline:none}
.fld::placeholder{color:#5B6672;opacity:1}
.vote{min-height:44px;min-width:64px;padding:0 12px;border:1px solid #C9CFD6;border-radius:999px;background:#fff;color:#2E3A46;font-size:14px;font-weight:600;font-family:'IBM Plex Mono',monospace;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.vote:hover{border-color:var(--accent);color:var(--accent)}
.vote.on{background:var(--accent);border-color:var(--accent);color:#fff}
.vote.on:hover{background:var(--accent-dark);color:#fff}
.vote[disabled]{opacity:.65;cursor:progress}
.vote .word{font-family:'IBM Plex Sans',system-ui,sans-serif;font-weight:500}
.thbtn{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:0 6px;margin-left:-6px;border-radius:6px;font:inherit;letter-spacing:inherit;text-transform:inherit;color:inherit}
.thbtn:hover{background:#E9EDF1;color:var(--ink)}
.thbtn.on{color:var(--accent)}
.thbtn:focus-visible{outline:2px solid var(--accent)}
.tr.head{padding:12px 20px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--soft)}
.tr.body{border-top:1px solid var(--line2)}
.tr.body:hover{background:var(--soft)}
.rowbtn{all:unset;cursor:pointer;font-weight:600;font-size:15px;line-height:1.35;display:inline-block;padding:2px 0;min-height:24px}
.rowbtn:hover{color:var(--accent);text-decoration:underline}
.rowbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ellipsis{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.avatar{width:28px;height:28px;flex:none;border-radius:50%;color:#fff;font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center}
.bar{flex:1;height:6px;border-radius:3px;background:var(--line2);overflow:hidden;max-width:72px}
.bar span{display:block;height:100%}

/* drawer */
.backdrop{position:fixed;inset:0;background:rgba(15,23,31,.45);border:0;padding:0;cursor:pointer}
.drawer{position:fixed;top:0;right:0;bottom:0;width:100%;max-width:560px;background:#fff;overflow-y:auto;box-shadow:-12px 0 40px rgba(15,23,31,.18);display:flex;flex-direction:column;z-index:10}
.iconbtn{flex:none;width:44px;height:44px;border-radius:8px;border:1px solid #C9CFD6;background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:520px){.g3,.g2{grid-template-columns:1fr}}

/* chat */
.chat{height:min(740px,calc(100vh - 160px));min-height:520px;display:flex;flex-direction:column;overflow:hidden}
.chat-head{padding:16px 22px;border-bottom:1px solid var(--line2);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.log{flex:1;min-height:0;overflow-y:auto;padding:22px;display:flex;flex-direction:column;gap:14px;background:var(--soft)}
.bot-av{width:30px;height:30px;flex:none;border-radius:50%;background:var(--ink);color:#fff;font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center}
.bub-bot{background:#fff;border:1px solid var(--line);border-radius:4px 14px 14px 14px;padding:12px 14px;font-size:15px;line-height:1.55;white-space:pre-line;overflow-wrap:anywhere}
.bub-user{background:var(--accent);color:#fff;border-radius:14px 4px 14px 14px;padding:10px 14px;font-size:15px;line-height:1.5;max-width:75%;white-space:pre-wrap;overflow-wrap:anywhere}
.status-card{margin-top:10px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;max-width:480px}
.tdot{width:7px;height:7px;border-radius:50%;background:#8A96A3;animation:tblink 1.2s infinite ease-in-out}
.tdot:nth-child(3){animation-delay:.2s}.tdot:nth-child(4){animation-delay:.4s}
@keyframes tblink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.ex{all:unset;box-sizing:border-box;display:block;width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;font-size:14px;line-height:1.4;cursor:pointer;background:#fff}
.ex:hover{border-color:#8A96A3;background:var(--soft)}
.ex:focus-visible{outline:2px solid var(--accent)}
footer{max-width:1360px;margin:0 auto;padding:0 24px 32px;font-size:13px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.tdot{animation:none}}
</style>

<body>

<script type="module">
import { html, render, Component } from 'https://unpkg.com/htm@3.1.1/preact/standalone.module.js';

/* ------------------------------------------------------------------ */
/* Reference data                                                      */
/* ------------------------------------------------------------------ */
const CATS = ['Compute & VMs', 'Storage & Backup', 'Network & DNS', 'Monitoring & Alerting', 'Automation & Self-service', 'Security & Compliance', 'Cost optimisation', 'Other'];
const STAGE = { new: 'New', assessment: 'In assessment', progress: 'In progress', closed: 'Closed' };
const DEC = { pending: 'Pending', approved: 'Approved', hold: 'On hold', rejected: 'Rejected' };
const PRIO = { critical: 'Critical', high: 'High', medium: 'Medium', low: 'Low' };
const URG = { low: 'Low', medium: 'Medium', high: 'High' };
const ASSIGNEES = ['Anna Nowak', 'Piotr Wiśniewski', 'Katarzyna Zielińska', 'Tomasz Lewandowski', 'Marta Kamińska'];
const FIB = [1, 2, 3, 5, 8, 13, 20];
const AV = ['#0E5C8C', '#0B6B5F', '#5B3FA0', '#8A4B12', '#3F4650', '#7A2E5C'];
const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const FIRST_NUM = 1049;

/* ------------------------------------------------------------------ */
/* Supabase connection                                                 */
/* Paste your Project URL and Publishable (or legacy "anon public")    */
/* key here. Both are designed to be public; access is controlled by   */
/* the rules in supabase/setup.sql. Leave empty for browser-only mode. */
/* ------------------------------------------------------------------ */
const SUPABASE_URL = 'https://uszqidtluxjkgeollejq.supabase.co';
const SUPABASE_KEY = 'sb_publishable_qD2Y7FMlX9ZX8Qm7qKWpBg_RtxGezs9';
const REMOTE = !!(SUPABASE_URL && SUPABASE_KEY);
const MAX_IDEAS = 100;

const fmt = (d) => { const p = d.split('-'); return Number(p[2]) + ' ' + MONTHS[Number(p[1]) - 1] + ' ' + p[0]; };
const initials = (n) => n ? n.split(' ').map((w) => w[0]).slice(0, 2).join('').toUpperCase() : '—';
const avBg = (n) => { if (!n) return '#6B7682'; let h = 0; for (let k = 0; k < n.length; k++) h = (h + n.charCodeAt(k)) % AV.length; return AV[h]; };
const cap = (x) => x.charAt(0).toUpperCase() + x.slice(1);
const today = () => new Date().toISOString().slice(0, 10);

/* WSJF = (User/business value + Time criticality + Risk reduction/opportunity enablement) / Job size */
const cod = (i) => (i.bv && i.tc && i.rr) ? i.bv + i.tc + i.rr : null;
const wsjf = (i) => { const c = cod(i); return (c === null || !i.js) ? null : Math.round(c / i.js * 10) / 10; };

const emptyForm = () => ({ title: '', category: '', urgency: 'medium', description: '', benefit: '', affected: '', name: '', email: '', team: '' });

const SEED_VOTES = { 'HS-1042': 4, 'HS-1043': 12, 'HS-1044': 7, 'HS-1045': 9, 'HS-1046': 3, 'HS-1047': 2, 'HS-1048': 1 };

const seed = () => [
  { id: 'HS-1048', title: 'Bare-metal hosting option for GPU workloads', category: 'Compute & VMs', urgency: 'medium', description: 'Offer dedicated bare-metal hosts with GPUs for teams running model training, instead of them buying their own hardware.', benefit: 'Keeps GPU workloads inside managed hosting with standard patching and monitoring.', affected: 'Data science teams', name: 'Jakub Mazur', email: 'jakub.mazur@example.com', team: 'Analytics', date: '2026-10-09', bv: 5, tc: 2, rr: 3, js: 20, notes: 'Capacity and power constraints in current DC. Revisit with the cloud GPU offering.', priority: 'low', assignee: 'Tomasz Lewandowski', stage: 'closed', decision: 'rejected' },
  { id: 'HS-1047', title: 'Storage tiering for cold backup data', category: 'Storage & Backup', urgency: 'medium', description: 'Automatically move backups older than 90 days to a cheaper archive tier while keeping restore SLAs for recent data.', benefit: 'Lower storage cost for long-retention backups.', affected: 'All backup policies', name: 'Ewa Krawczyk', email: 'ewa.krawczyk@example.com', team: 'Finance IT', date: '2026-10-08', bv: null, tc: null, rr: null, js: null, notes: '', priority: '', assignee: '', stage: 'new', decision: 'pending' },
  { id: 'HS-1046', title: 'Rightsizing report for idle and oversized VMs', category: 'Cost optimisation', urgency: 'medium', description: 'Monthly report to app owners listing VMs with sustained low CPU and memory use, with a suggested smaller size.', benefit: 'Reduce wasted compute; make costs visible to owners.', affected: 'App owners, FinOps', name: 'Michał Dąbrowski', email: 'michal.dabrowski@example.com', team: 'FinOps', date: '2026-10-06', bv: 8, tc: 3, rr: 5, js: 3, notes: 'Depends on monitoring data retention of 30+ days.', priority: 'medium', assignee: 'Marta Kamińska', stage: 'assessment', decision: 'hold' },
  { id: 'HS-1045', title: 'Automated patching windows for Windows Server fleet', category: 'Automation & Self-service', urgency: 'high', description: 'Let app owners pick a recurring maintenance window per server group; patching, reboot and health checks run automatically within it.', benefit: 'Fewer manual change requests and missed patch cycles.', affected: 'Windows Server VMs, all regions', name: 'Agnieszka Wójcik', email: 'agnieszka.wojcik@example.com', team: 'Infrastructure Ops', date: '2026-10-02', bv: 13, tc: 8, rr: 13, js: 8, notes: '', priority: 'high', assignee: 'Piotr Wiśniewski', stage: 'assessment', decision: 'pending' },
  { id: 'HS-1044', title: 'Unified monitoring dashboards for hosted applications', category: 'Monitoring & Alerting', urgency: 'medium', description: 'One standard dashboard per hosted application showing availability, CPU, memory, disk and recent alerts.', benefit: 'Faster triage; app owners self-serve status instead of raising tickets.', affected: 'App owners, Service Desk', name: 'Paweł Szymański', email: 'pawel.szymanski@example.com', team: 'Service Desk', date: '2026-09-24', bv: 8, tc: 5, rr: 8, js: 5, notes: 'Approved at CAB. Template built on existing monitoring stack.', priority: 'medium', assignee: 'Katarzyna Zielińska', stage: 'progress', decision: 'approved' },
  { id: 'HS-1043', title: 'Self-service VM provisioning from the service catalogue', category: 'Automation & Self-service', urgency: 'high', description: 'Standard VM sizes orderable from the service catalogue, built automatically with baseline hardening, backup and monitoring.', benefit: 'Provisioning time from days to under an hour.', affected: 'All requesting teams', name: 'Anna Nowak', email: 'anna.nowak@example.com', team: 'Hosting Services', date: '2026-09-15', bv: 20, tc: 13, rr: 8, js: 13, notes: 'Phase 1: Windows and Linux standard sizes only.', priority: 'critical', assignee: 'Anna Nowak', stage: 'progress', decision: 'approved' },
  { id: 'HS-1042', title: 'Self-service DNS record requests', category: 'Network & DNS', urgency: 'low', description: 'Form-driven A/CNAME record creation for internal zones with automatic validation and approval by zone owner.', benefit: 'Removes a frequent manual ticket type.', affected: 'Internal DNS zones', name: 'Tomasz Lewandowski', email: 'tomasz.lewandowski@example.com', team: 'Network', date: '2026-09-03', bv: 5, tc: 2, rr: 2, js: 2, notes: 'Delivered 2026-10-01.', priority: 'low', assignee: 'Tomasz Lewandowski', stage: 'closed', decision: 'approved' }
].map((i) => Object.assign(i, { votes: SEED_VOTES[i.id] || 0 }));

/* ------------------------------------------------------------------ */
/* Storage — swap this for Supabase later; the rest of the app stays.  */
/* ------------------------------------------------------------------ */
const LS_KEY = 'ideahub.demo.v1';
const store = {
  load() {
    try {
      const raw = localStorage.getItem(LS_KEY);
      if (!raw) return null;
      const d = JSON.parse(raw);
      return Array.isArray(d.ideas) && typeof d.nextNum === 'number' ? d : null;
    } catch (e) { return null; }
  },
  save(d) { try { localStorage.setItem(LS_KEY, JSON.stringify(d)); } catch (e) { /* storage unavailable: keep working in memory */ } },
  clear() { try { localStorage.removeItem(LS_KEY); localStorage.removeItem(VOTES_KEY); } catch (e) { /* ignore */ } },
  /* browser-only mode: which ideas this browser has voted for */
  loadVotes() { try { return JSON.parse(localStorage.getItem(VOTES_KEY) || '{}') || {}; } catch (e) { return {}; } },
  saveVotes(v) { try { localStorage.setItem(VOTES_KEY, JSON.stringify(v)); } catch (e) { /* ignore */ } }
};

/* Voting: each browser gets a random, anonymous voter ID (no sign-in).
   The database allows one vote per idea per voter ID; voting again removes the vote. */
const VOTER_KEY = 'ideahub.voter.v1';
const VOTES_KEY = 'ideahub.myvotes.v1';
const newUuid = () => (window.crypto && window.crypto.randomUUID) ? window.crypto.randomUUID()
  : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, (c) => { const r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16); });
const voterId = (() => {
  try {
    let v = localStorage.getItem(VOTER_KEY);
    if (!v) { v = newUuid(); localStorage.setItem(VOTER_KEY, v); }
    return v;
  } catch (e) { return newUuid(); } /* storage blocked: votes still work for this visit */
})();

/* Supabase REST API (PostgREST). Email is never read back: the public key can't see that column. */
const COLS = 'id,title,category,urgency,description,benefit,affected,name,team,bv,tc,rr,js,notes,priority,assignee,stage,decision,votes,created_at';
const api = {
  async req(path, opts) {
    const o = opts || {};
    const res = await fetch(SUPABASE_URL.replace(/\/+$/, '') + '/rest/v1/' + path, {
      method: o.method || 'GET',
      headers: Object.assign({ apikey: SUPABASE_KEY, 'Content-Type': 'application/json' }, o.headers || {}),
      body: o.body
    });
    if (!res.ok) {
      let msg = '';
      try { const j = await res.json(); msg = j.message || j.error || ''; } catch (e) { /* not JSON */ }
      const err = new Error(msg || 'HTTP ' + res.status);
      err.status = res.status;
      throw err;
    }
    return res.status === 204 ? null : res.json();
  },
  list() { return this.req('ideas?select=' + COLS + '&order=created_at.desc&limit=200'); },
  async insert(row) {
    const id = await this.req('rpc/submit_idea', { method: 'POST', body: JSON.stringify({
      p_title: row.title, p_category: row.category, p_urgency: row.urgency, p_description: row.description,
      p_benefit: row.benefit, p_affected: row.affected, p_name: row.name, p_email: row.email, p_team: row.team }) });
    const rows = await this.req('ideas?select=' + COLS + '&id=eq.' + encodeURIComponent(id));
    return rows[0];
  },
  update(id, patch) { return this.req('ideas?id=eq.' + encodeURIComponent(id), { method: 'PATCH', headers: { Prefer: 'return=minimal' }, body: JSON.stringify(patch) }); },
  byEmail(email) { return this.req('rpc/ideas_by_email', { method: 'POST', body: JSON.stringify({ p_email: email }) }); },
  toggleVote(id) { return this.req('rpc/toggle_vote', { method: 'POST', body: JSON.stringify({ p_idea_id: id, p_voter_id: voterId }) }); },
  myVotes() { return this.req('rpc/my_votes', { method: 'POST', body: JSON.stringify({ p_voter_id: voterId }) }); }
};
const fromRow = (r) => Object.assign({}, r, { email: '', date: String(r.created_at).slice(0, 10) });
const friendlyError = (e) => {
  const m = String((e && e.message) || '');
  if (/IDEA_LIMIT_REACHED/.test(m)) return 'The demo is full — it holds at most ' + MAX_IDEAS + ' ideas.';
  if (/VOTE_LIMIT_REACHED/.test(m)) return 'The demo has reached its vote limit, so new votes can\'t be added.';
  if (/IDEA_NOT_FOUND/.test(m)) return 'That idea no longer exists.';
  if (e instanceof TypeError || /fetch|network/i.test(m)) return 'Can\'t reach the database right now. Please try again in a moment.';
  return 'The database refused that change (' + m + ').';
};

const greeting = () => ({ id: 1, from: 'bot', text: 'Hi! I\'m the Hosting Services idea assistant.\n\nI can help you raise a new idea, or check the status of an idea you\'ve already submitted. What would you like to do?', cardId: null });

/* Thumbs-up icon: a function so each button gets its own copy */
const thumbIcon = () => html`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 10v12"/><path d="M15 5.88 14 10h5.83a2 2 0 0 1 1.92 2.56l-2.33 8A2 2 0 0 1 17.5 22H4a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h2.76a2 2 0 0 0 1.79-1.11L12 2a3.13 3.13 0 0 1 3 3.88Z"/></svg>`;

/* Small inline icons (stroke, currentColor) */
const Icon = {
  chat: html`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg>`,
  plus: html`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>`,
  close: html`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>`,
  send: html`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12l16-8-6 16-3-7z"/></svg>`,
  search: html`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5B6672" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="position:absolute;left:12px;top:14px"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg>`,
  check: html`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.5 2.5L16 9.5"/></svg>`,
  server: html`<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="6" rx="1.5"/><rect x="3" y="14" width="18" height="6" rx="1.5"/><path d="M7 7h.01M7 17h.01"/></svg>`,
  bulb: html`<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.6.5 1.1 1.3 1.1 2.2h5c0-.9.5-1.7 1.1-2.2A6 6 0 0 0 12 3z"/></svg>`
};

/* ------------------------------------------------------------------ */
/* App                                                                 */
/* ------------------------------------------------------------------ */
class App extends Component {
  constructor() {
    super();
    const saved = REMOTE ? null : store.load();
    this.state = {
      view: 'assistant',
      form: emptyForm(), errors: {}, lastId: null, submitting: false, formError: '', errSummary: '',
      stage: 'all', q: '', decFilter: 'all', prioFilter: 'all', sort: 'newest', selId: null,
      ideas: REMOTE ? [] : (saved ? saved.ideas : seed()),
      nextNum: saved ? saved.nextNum : FIRST_NUM,
      loading: REMOTE, error: '',
      myVotes: REMOTE ? {} : store.loadVotes(), votePending: {},
      chat: [greeting()], chatInput: '', typing: false, flow: null, chatChips: null, lastEmail: ''
    };
    this.mid = 100;
    this.saveTimers = {};
    this.logRef = (el) => { this.logEl = el; };
    this.onKey = (e) => { if (e.key === 'Escape' && this.state.selId) this.closeSel(); };
  }

  /* ---------- idea panel (dialog): open, close, keep focus inside ---------- */
  openSel(id) {
    const a = document.activeElement;
    this.returnFocus = a && a.id ? a.id : null; /* remembered by id, so it survives a list refresh */
    this.setState({ selId: id });
  }

  closeSel() {
    this.setState({ selId: null });
  }

  trapFocus(e) {
    if (e.key !== 'Tab' || !this.drawerEl) return;
    const items = [...this.drawerEl.querySelectorAll('button:not([disabled]), select, textarea, input, a[href], [tabindex="0"]')]
      .filter((el) => el.offsetWidth > 0 || el.offsetHeight > 0);
    if (!items.length) return;
    const first = items[0], last = items[items.length - 1];
    const active = document.activeElement;
    if (e.shiftKey && (active === first || active === this.drawerEl)) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && (active === last || active === this.drawerEl)) { e.preventDefault(); first.focus(); }
  }

  componentDidMount() { document.addEventListener('keydown', this.onKey); this.reload(); this.updateTitle(); }

  updateTitle() {
    const names = { assistant: 'Idea assistant', submit: 'Submit an idea', dashboard: 'Idea dashboard', about: 'About the author' };
    document.title = (names[this.state.view] || 'Idea Hub') + ' · Idea Hub';
  }
  componentWillUnmount() { document.removeEventListener('keydown', this.onKey); clearTimeout(this.chatTimer); }

  componentDidUpdate(_, prev) {
    const s = this.state;
    if (!REMOTE && (prev.ideas !== s.ideas || prev.nextNum !== s.nextNum)) store.save({ ideas: s.ideas, nextNum: s.nextNum });
    const n = s.chat.length + (s.typing ? 1 : 0);
    if (this.logEl && (n !== this.lastN || this.logEl !== this.lastEl)) {
      this.lastN = n; this.lastEl = this.logEl;
      this.logEl.scrollTop = this.logEl.scrollHeight;
    }
    if (prev.selId !== s.selId && s.selId && this.drawerEl) this.drawerEl.focus();
    /* panel closed: put focus back where it was (the idea title), or on the page heading */
    if (prev.selId && !s.selId) {
      const back = this.returnFocus && document.getElementById(this.returnFocus);
      this.returnFocus = null;
      if (back) back.focus();
      else { const m = document.getElementById('main'); if (m) m.focus(); }
    }
    if (prev.view !== s.view) this.updateTitle();
    /* failed form submit: move focus to the first field with an error */
    if (this.focusFirstError) {
      this.focusFirstError = false;
      const bad = document.querySelector('[aria-invalid="true"]');
      if (bad) bad.focus();
    }
  }

  /* ---------- data helpers ---------- */
  async reload() {
    if (!REMOTE) return;
    try {
      const res = await Promise.all([api.list(), api.myVotes().catch(() => null)]);
      const upd = { ideas: res[0].map(fromRow), loading: false, error: '' };
      if (res[1]) { const mv = {}; res[1].forEach((id) => { mv[id] = true; }); upd.myVotes = mv; }
      this.setState(upd);
    } catch (e) {
      this.setState({ loading: false, error: friendlyError(e) });
    }
  }

  /* Saves a new idea and returns its ID. Throws (with a readable message) if the database refuses it. */
  async addIdea(d) {
    const row = {
      title: d.title, category: d.category, urgency: d.urgency || 'medium', description: d.description,
      benefit: d.benefit || '', affected: d.affected || '', name: d.name, email: d.email, team: d.team || ''
    };
    if (REMOTE) {
      let saved;
      try { saved = await api.insert(row); } catch (e) { throw new Error(friendlyError(e)); }
      const idea = fromRow(saved);
      this.setState({ ideas: [idea].concat(this.state.ideas.filter((x) => x.id !== idea.id)), error: '' });
      return idea.id;
    }
    const id = 'HS-' + this.state.nextNum;
    const idea = Object.assign(row, { id, date: today(), bv: null, tc: null, rr: null, js: null, notes: '', priority: '', assignee: '', stage: 'new', decision: 'pending', votes: 0 });
    this.setState({ ideas: [idea].concat(this.state.ideas), nextNum: this.state.nextNum + 1 });
    return id;
  }

  patchSel(key, raw) {
    const numeric = ['bv', 'tc', 'rr', 'js'].indexOf(key) !== -1;
    const v = numeric ? (raw === '' ? null : Number(raw)) : raw;
    const id = this.state.selId;
    this.setState({ ideas: this.state.ideas.map((i) => i.id === id ? Object.assign({}, i, { [key]: v }) : i) });
    if (!REMOTE) return;
    const timerKey = id + ':' + key;
    clearTimeout(this.saveTimers[timerKey]);
    this.saveTimers[timerKey] = setTimeout(() => {
      api.update(id, { [key]: v })
        .then(() => { if (this.state.error) this.setState({ error: '' }); })
        .catch((e) => { this.setState({ error: friendlyError(e) }); this.reload(); });
    }, key === 'notes' ? 700 : 0);
  }

  /* Vote, or remove this browser's vote. Updates the screen at once, then confirms with the database. */
  async toggleVote(id) {
    if (this.state.votePending[id]) return;
    const had = !!this.state.myVotes[id];
    const before = (this.state.ideas.find((x) => x.id === id) || {}).votes || 0;
    const apply = (voted, votes) => {
      const mv = Object.assign({}, this.state.myVotes);
      if (voted) mv[id] = true; else delete mv[id];
      this.setState({ myVotes: mv, ideas: this.state.ideas.map((x) => x.id === id ? Object.assign({}, x, { votes }) : x) });
      return mv;
    };
    const mv = apply(!had, Math.max(0, before + (had ? -1 : 1)));
    if (!REMOTE) { store.saveVotes(mv); return; }
    this.setState({ votePending: Object.assign({}, this.state.votePending, { [id]: true }) });
    try {
      const r = await api.toggleVote(id);
      apply(!!r.voted, r.votes);
    } catch (e) {
      apply(had, before);
      this.setState({ error: friendlyError(e) });
    } finally {
      const p = Object.assign({}, this.state.votePending);
      delete p[id];
      this.setState({ votePending: p });
    }
  }

  renderVote(i, withWord) {
    const on = !!this.state.myVotes[i.id];
    const n = i.votes || 0;
    return html`
      <button type="button" class=${'vote' + (on ? ' on' : '')} aria-pressed=${on ? 'true' : 'false'} disabled=${!!this.state.votePending[i.id]}
        title=${on ? 'You voted for this idea. Click to remove your vote.' : 'Vote for this idea'}
        aria-label=${(on ? 'Voted for ' + i.id + ', ' : 'Vote for ' + i.id + ', ') + n + (n === 1 ? ' vote' : ' votes') + (on ? '. Click to remove your vote' : '')}
        onClick=${() => this.toggleVote(i.id)}>
        ${thumbIcon()}<span>${n}</span>${withWord && html`<span class="word">${on ? 'Voted' : 'Vote'}</span>`}
      </button>`;
  }

  resetDemo() {
    if (!window.confirm('Reset the demo? This removes ideas you added and restores the sample data.')) return;
    store.clear();
    clearTimeout(this.chatTimer);
    this.setState({ myVotes: {}, ideas: seed(), nextNum: FIRST_NUM, selId: null, lastId: null, chat: [greeting()], flow: null, chatChips: null, typing: false, lastEmail: '' });
  }

  /* ---------- form ---------- */
  setForm(k) {
    return (e) => this.setState({ form: Object.assign({}, this.state.form, { [k]: e.target.value }), errors: Object.assign({}, this.state.errors, { [k]: false }) });
  }

  async submit(e) {
    e.preventDefault();
    if (this.state.submitting) return;
    const f = this.state.form;
    const errors = {
      title: f.title.trim().length < 4, category: !f.category, description: f.description.trim().length < 15,
      name: f.name.trim().length < 2, email: !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(f.email.trim())
    };
    const nErr = Object.values(errors).filter(Boolean).length;
    if (nErr) {
      this.focusFirstError = true;
      this.setState({ errors, lastId: null, formError: '', errSummary: 'Please fix ' + nErr + (nErr === 1 ? ' field' : ' fields') + ' marked below.' });
      return;
    }
    this.setState({ errSummary: '' });
    const t = (x) => x.trim();
    this.setState({ submitting: true, formError: '' });
    try {
      const id = await this.addIdea({ title: t(f.title), category: f.category, urgency: f.urgency, description: t(f.description), benefit: t(f.benefit), affected: t(f.affected), name: t(f.name), email: t(f.email), team: t(f.team) });
      this.setState({ form: emptyForm(), errors: {}, lastId: id, submitting: false });
    } catch (err) {
      this.setState({ submitting: false, formError: err.message });
    }
  }

  /* ---------- assistant ---------- */
  handleChat(text) {
    const t = String(text || '').trim();
    if (!t || this.state.typing) return;
    this.mid += 1;
    this.setState({ chat: this.state.chat.concat([{ id: this.mid, from: 'user', text: t, cardId: null }]), chatInput: '', typing: true });
    clearTimeout(this.chatTimer);
    this.chatTimer = setTimeout(() => this.respond(t), 550);
  }

  async respond(t) {
    if (REMOTE) await this.reload(); /* fresh statuses before answering */
    const s = this.state;
    const low = t.toLowerCase();
    const out = [];
    let upd = {};
    let chips = null;
    let flow = s.flow;
    const say = (text, cardId) => { this.mid += 1; out.push({ id: this.mid, from: 'bot', text, cardId: cardId || null }); };
    const idMatch = t.match(/hs[-\s]?(\d{3,5})/i);
    const emailMatch = t.match(/[^\s@]+@[^\s@]+\.[^\s@]+/);

    const startRaise = (title) => {
      if (title) {
        flow = { mode: 'raise', step: 'category', draft: { title, urgency: 'medium' } };
        say('Great idea — I\'ll use “' + title + '” as the working title.\n\nWhich service area does it relate to?');
      } else {
        flow = { mode: 'raise', step: 'title', draft: { urgency: 'medium' } };
        say('Great, let\'s capture your idea. I\'ll ask a few short questions — type “cancel” at any time.\n\nFirst, what\'s a short title for your idea?');
      }
    };

    const findStatus = async () => {
      if (idMatch) {
        const id = 'HS-' + idMatch[1];
        if (s.ideas.find((x) => x.id === id)) say('Here\'s the latest on ' + id + ':', id);
        else say('I couldn\'t find an idea with ID ' + id + '. Check the number, or give me the email address you submitted it with.');
        return true;
      }
      const email = emailMatch ? emailMatch[0].toLowerCase() : (/\bmy ideas?\b/.test(low) && s.lastEmail ? s.lastEmail : null);
      if (email) {
        let mine;
        if (REMOTE) {
          let ids = [];
          try { ids = await api.byEmail(email); } catch (e) { say(friendlyError(e)); return true; }
          mine = ids.map((id) => this.state.ideas.find((x) => x.id === id)).filter(Boolean);
        } else {
          mine = s.ideas.filter((x) => x.email.toLowerCase() === email);
        }
        upd.lastEmail = email;
        if (!mine.length) { say('I didn\'t find any ideas submitted with ' + email + '. Is that the address you used?'); return true; }
        if (mine.length === 1) { say('I found one idea submitted by ' + email + ':', mine[0].id); return true; }
        say('I found ' + mine.length + ' ideas submitted by ' + email + ':\n\n' + mine.map((x) => '• ' + x.id + ' — ' + x.title + '\n   ' + STAGE[x.stage] + ' · decision ' + DEC[x.decision]).join('\n') + '\n\nPick one below for full details.');
        chips = mine.map((x) => x.id);
        return true;
      }
      return false;
    };

    if (/^(cancel|stop|back to menu|menu)$/.test(low)) {
      say(flow ? 'No problem, I\'ve cancelled that. What would you like to do next?' : 'What would you like to do?');
      flow = null;
    } else if (flow && flow.mode === 'raise') {
      const d = Object.assign({}, flow.draft);
      const step = flow.step;
      const go = (next) => { flow = { mode: 'raise', step: next, draft: d }; };
      if (low === 'start over') {
        startRaise(null);
      } else if (step === 'title') {
        if (t.length < 4) say('Could you give it a slightly longer title? A few words is perfect.');
        else { d.title = cap(t); go('category'); say('Thanks. Which service area does it relate to?'); }
      } else if (step === 'category') {
        const c = CATS.find((x) => x.toLowerCase() === low) || CATS.find((x) => low.length >= 3 && x.toLowerCase().indexOf(low) !== -1) || CATS.find((x) => low.indexOf(x.toLowerCase().split(' ')[0]) !== -1);
        d.category = c || 'Other';
        go('description');
        say((c ? '' : 'I\'ll file that under “Other” — the team can recategorise it.\n\n') + 'Now describe the idea: what would you change, and how would it work?');
      } else if (step === 'description') {
        if (t.length < 15) say('Could you add a bit more detail? A sentence or two about what would change helps the team score it.');
        else { d.description = t; go('benefit'); say('What benefit do you expect — time saved, cost reduced, risk lowered, a better experience? You can also skip this.'); }
      } else if (step === 'benefit') {
        d.benefit = low === 'skip' ? '' : t; go('urgency'); say('How urgent is it from your side?');
      } else if (step === 'urgency') {
        d.urgency = /high|urgent/.test(low) ? 'high' : /low|nice/.test(low) ? 'low' : 'medium';
        go('name'); say('Almost done. What\'s your name?');
      } else if (step === 'name') {
        if (t.length < 2) say('Please tell me your name.');
        else { d.name = t; go('email'); say('And your work email, so the team can keep you posted?'); }
      } else if (step === 'email') {
        if (!emailMatch) say('That doesn\'t look like an email address — could you check it?');
        else {
          d.email = emailMatch[0]; go('confirm');
          say('Here\'s your idea:\n\n• Title: ' + d.title + '\n• Service area: ' + d.category + '\n• Description: ' + d.description + '\n• Expected benefit: ' + (d.benefit || '—') + '\n• Urgency: ' + URG[d.urgency] + '\n• Submitted by: ' + d.name + ' (' + d.email + ')\n\nShall I submit it?');
        }
      } else if (step === 'confirm') {
        if (/submit|yes|confirm|^ok|send/.test(low)) {
          try {
            const id = await this.addIdea(d);
            upd.lastEmail = d.email.toLowerCase();
            flow = null;
            say('Done! Your idea is raised as ' + id + '. It starts as New with decision Pending — the Hosting Services team will score it with WSJF and assign an owner.\n\nAsk me about ' + id + ' any time to see where it stands.', id);
          } catch (err) {
            say('Sorry, I couldn\'t save your idea. ' + err.message + '\n\nYou can try “Submit idea” again, or “Cancel”.');
          }
        } else {
          say('Reply “Submit idea” to send it, “Start over” to begin again, or “Cancel”.');
        }
      }
    } else if (flow && flow.mode === 'status') {
      if (await findStatus()) flow = null;
      else say('I need an idea ID like HS-1043, or the email address you used when submitting. Type “cancel” to go back.');
    } else if (/wsjf|score|prioriti/.test(low)) {
      say('WSJF (Weighted Shortest Job First) ranks ideas by Cost of Delay ÷ Job Size.\n\nCost of Delay = User/business value + Time criticality + Risk reduction/opportunity enablement, each scored relative to other ideas on a 1–20 Fibonacci scale. Job Size is the relative effort to deliver.\n\nA valuable, urgent, small job gets the highest score and is picked up first.');
    } else if (/\b(vote|upvote|support|like)\b/.test(low) && idMatch) {
      const id = 'HS-' + idMatch[1];
      if (!this.state.ideas.find((x) => x.id === id)) {
        say('I couldn\'t find an idea with ID ' + id + '.');
      } else if (this.state.myVotes[id]) {
        say('You\'ve already voted for ' + id + ' — each idea gets one vote per person. To take your vote back, click the highlighted vote button.', id);
      } else {
        await this.toggleVote(id);
        if (this.state.myVotes[id]) {
          const n = (this.state.ideas.find((x) => x.id === id) || {}).votes || 0;
          say('Thanks — your vote for ' + id + ' is in. It now has ' + n + (n === 1 ? ' vote.' : ' votes.'), id);
        } else {
          say('Sorry, I couldn\'t record your vote. ' + (this.state.error || 'Please try again.'));
        }
      }
    } else if (idMatch || emailMatch || /status|check|track|progress|where|my ideas?\b/.test(low)) {
      if (!(await findStatus())) { flow = { mode: 'status' }; say('Sure — give me the idea ID (for example HS-1043) or the email address you submitted it with.'); }
    } else if (/idea|raise|submit|new|propose|suggest/.test(low)) {
      const m = t.match(/idea\s+(?:to|for|about)\s+(.{4,})/i);
      startRaise(m ? cap(m[1].replace(/[.!?]+$/, '').trim()) : null);
    } else if (/^(hi|hello|hey|good (morning|afternoon))\b/.test(low)) {
      say('Hi! I can help you raise a new idea or check the status of one you\'ve submitted. Which would you like?');
    } else {
      say('Sorry, I didn\'t catch that. I can help with two things: raising a new idea for Hosting Services, or checking the status of an idea you\'ve already submitted.');
    }

    this.setState(Object.assign({ chat: this.state.chat.concat(out), flow, typing: false, chatChips: chips }, upd));
  }

  resetChat() {
    clearTimeout(this.chatTimer);
    this.setState({ chat: [greeting()], flow: null, chatChips: null, typing: false, chatInput: '' });
  }

  openIdea(id) { this.returnFocus = null; this.setState({ view: 'dashboard', stage: 'all', q: '', decFilter: 'all', prioFilter: 'all', selId: id }); }

  /* ---------- views ---------- */
  renderHeader(view) {
    const tab = (key, label, extra) => html`
      <button type="button" class=${'tab' + (view === key ? ' on' : '')} aria-current=${view === key ? 'page' : null} onClick=${() => { this.setState({ view: key, selId: null }); if (key === 'dashboard') this.reload(); }}>${extra}${label}</button>`;
    return html`
      <a class="skip" href="#main" onClick=${(e) => { e.preventDefault(); const m = document.getElementById('main'); if (m) m.focus(); }}>Skip to content</a>
      <header class="top">
        <div class="top-in">
          <div class="brand">
            <div class="logo">${Icon.server}</div>
            <div>
              <div style="font-size:18px;font-weight:700;letter-spacing:-.01em">Hosting Services Idea Hub</div>
              <div style="font-size:13px;color:#A9B6C3">Submit, assess and track improvement ideas</div>
            </div>
          </div>
          <nav class="tabs" aria-label="Sections">

  renderDashboard() {
    const s = this.state;
    const ideas = s.ideas;
    const count = (fn) => ideas.filter(fn).length;
    const kpis = [
      { label: 'Total ideas', value: ideas.length, sub: count((i) => i.stage !== 'closed') + ' open', cls: 'd-pending' },
      { label: 'New', value: count((i) => i.stage === 'new'), sub: 'Awaiting triage', cls: 's-new' },
      { label: 'In assessment', value: count((i) => i.stage === 'assessment'), sub: count((i) => i.stage === 'assessment' && wsjf(i) === null) + ' not yet scored', cls: 's-assessment' },
      { label: 'In progress', value: count((i) => i.stage === 'progress'), sub: count((i) => i.stage === 'progress' && !i.assignee) + ' without an owner', cls: 's-progress' },
      { label: 'Decision pending', value: count((i) => i.decision === 'pending'), sub: count((i) => i.decision === 'approved') + ' approved · ' + count((i) => i.decision === 'rejected') + ' rejected', cls: 'd-hold' }
    ];
    const chips = [['all', 'All'], ['new', 'New'], ['assessment', 'In assessment'], ['progress', 'In progress'], ['closed', 'Closed']];
    const q = s.q.trim().toLowerCase();
    const rows = ideas.filter((i) =>
      (s.stage === 'all' || i.stage === s.stage) &&
      (s.decFilter === 'all' || i.decision === s.decFilter) &&
      (s.prioFilter === 'all' || (s.prioFilter === 'none' ? !i.priority : i.priority === s.prioFilter)) &&
      (!q || (i.id + ' ' + i.title + ' ' + i.category + ' ' + i.assignee + ' ' + i.name).toLowerCase().indexOf(q) !== -1)
    ).sort((a, b) => {
      if (s.sort === 'votes' || s.sort === 'votes_asc') {
        const dv = (b.votes || 0) - (a.votes || 0);
        if (dv) return s.sort === 'votes' ? dv : -dv;
      }
      if (s.sort === 'wsjf') {
        const x = wsjf(a), y = wsjf(b);
        if (x !== y) return y === null ? -1 : x === null ? 1 : y - x;
      }
      return a.date < b.date ? 1 : a.date > b.date ? -1 : (a.id < b.id ? 1 : -1);
    });
    const maxW = Math.max(1, ...ideas.map((i) => wsjf(i) || 0));
    const sel = (label, value, onChange, opts, width) => html`
      <label style="display:block"><span class="sr">${label}</span>
        <select class="fld" value=${value} onChange=${onChange} style=${'width:' + width + 'px'}>
          ${opts.map((o) => html`<option value=${o[0]}>${o[1]}</option>`)}
        </select>
      </label>`;

    return html`
      <main class="wrap" id="main" tabindex="-1" style="display:flex;flex-direction:column;gap:24px">
        <div style="display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px">

            <h1 class="title">Idea dashboard</h1>
            <p class="muted" style="margin:6px 0 0;font-size:15px">Track new ideas and ideas in progress. Select an idea to score it with WSJF, set priority, assign an owner and record the decision.</p>
          </div>
          <button type="button" class="btn primary" onClick=${() => this.setState({ view: 'submit' })}>${Icon.plus}New idea</button>
        </div>

        <div class="kpis">
          ${kpis.map((k) => html`
            <div class="card kpi" key=${k.label}>
              <div style="display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500;color:#3F4650"><span class=${'pill ' + k.cls} style="width:10px;height:10px;padding:0"></span>${k.label}</div>
              <div class="v">${k.value}</div>
              <div class="muted" style="font-size:13px">${k.sub}</div>
            </div>`)}
        </div>

        <section class="card">
          <div class="toolbar">
            <div role="group" aria-label="Filter by stage" style="display:flex;flex-wrap:wrap;gap:8px">
              ${chips.map((c) => html`
                <button type="button" key=${c[0]} class=${'chip' + (s.stage === c[0] ? ' on' : '')} aria-pressed=${s.stage === c[0] ? 'true' : 'false'} onClick=${() => this.setState({ stage: c[0] })}>
                  ${c[1]} <span class="n">${c[0] === 'all' ? ideas.length : count((i) => i.stage === c[0])}</span>
                </button>`)}
            </div>
            <div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center">
              <label style="position:relative;display:block"><span class="sr">Search ideas</span>${Icon.search}
                <input class="fld" type="search" placeholder="Search title, ID, owner…" value=${s.q} onInput=${(e) => this.setState({ q: e.target.value })} style="width:240px;padding-left:36px" />
              </label>
              ${sel('Filter by decision', s.decFilter, (e) => this.setState({ decFilter: e.target.value }), [['all', 'All decisions'], ['pending', 'Pending'], ['approved', 'Approved'], ['hold', 'On hold'], ['rejected', 'Rejected']], 170)}
              ${sel('Filter by priority', s.prioFilter, (e) => this.setState({ prioFilter: e.target.value }), [['all', 'All priorities'], ['critical', 'Critical'], ['high', 'High'], ['medium', 'Medium'], ['low', 'Low'], ['none', 'Not set']], 160)}
              ${sel('Sort ideas', s.sort, (e) => this.setState({ sort: e.target.value }), [['newest', 'Sort: newest first'], ['wsjf', 'Sort: highest WSJF'], ['votes', 'Sort: most votes'], ['votes_asc', 'Sort: fewest votes']], 190)}
            </div>
          </div>

          <div style="overflow-x:auto">
            <div class="tbl" role="table" aria-label="Ideas" aria-describedby="tbl-summary" aria-rowcount=${rows.length + 1}>
              <div class="tr head" role="row"><div role="columnheader">ID</div>
                <div role="columnheader" aria-sort=${s.sort === 'votes' ? 'descending' : s.sort === 'votes_asc' ? 'ascending' : 'none'}>
                  <button type="button" class=${'thbtn' + (s.sort === 'votes' || s.sort === 'votes_asc' ? ' on' : '')}
                    title=${s.sort === 'votes' ? 'Sorted by most votes. Click for fewest votes first.' : 'Sort by most votes'}
                    onClick=${() => this.setState({ sort: s.sort === 'votes' ? 'votes_asc' : 'votes' })}>
                    Votes <span aria-hidden="true">${s.sort === 'votes' ? '↓' : s.sort === 'votes_asc' ? '↑' : '↕'}</span>
                  </button>
                </div><div role="columnheader">Idea</div><div role="columnheader">Submitted</div><div role="columnheader" aria-sort=${s.sort === 'wsjf' ? 'descending' : 'none'}>WSJF</div><div role="columnheader">Priority</div><div role="columnheader">Assigned to</div><div role="columnheader">Stage</div><div role="columnheader">Decision</div></div>
              ${rows.map((i) => {
                const sc = wsjf(i);
                const ratio = sc === null ? 0 : sc / maxW;
                return html`
                <div class="tr body" role="row" key=${i.id}>
                  <div role="cell" class="mono" style="font-size:13px;color:#3F4650">${i.id}</div>
                  <div role="cell">${this.renderVote(i)}</div>
                  <div role="cell" style="min-width:0">
                    <button type="button" class="rowbtn" id=${'open-' + i.id} onClick=${() => this.openSel(i.id)}>${i.title}</button>
                    <div class="muted ellipsis" style="font-size:13px;margin-top:3px">${i.category} · ${i.description}</div>
                  </div>
                  <div role="cell"><div style="font-weight:500">${i.name}</div><div class="muted" style="font-size:13px;margin-top:2px">${fmt(i.date)}</div></div>
                  <div role="cell" style="display:flex;align-items:center;gap:10px">
                    <span class="mono" style="font-weight:500;width:38px">${sc === null ? '—' : sc.toFixed(1)}</span>
                    <span class="bar" aria-hidden="true"><span class=${ratio >= 0.66 ? 'sc-hi' : ratio >= 0.33 ? 'sc-mid' : 'sc-lo'} style=${'width:' + Math.round(ratio * 100) + '%'}></span></span>
                  </div>
                  <div role="cell"><span class=${'pill ' + (i.priority ? 'p-' + i.priority : 'p-none')}>${PRIO[i.priority] || 'Not set'}</span></div>
                  <div role="cell" style="display:flex;align-items:center;gap:8px;min-width:0">
                    <span class="avatar" aria-hidden="true" style=${'background:' + avBg(i.assignee)}>${initials(i.assignee)}</span>
                    <span class=${'ellipsis' + (i.assignee ? '' : ' muted')}>${i.assignee || 'Unassigned'}</span>
                  </div>
                  <div role="cell"><span class=${'pill s-' + i.stage}><span class="dot" aria-hidden="true"></span>${STAGE[i.stage]}</span></div>
                  <div role="cell"><span class=${'pill d-' + i.decision}>${DEC[i.decision]}</span></div>
                </div>`;
              })}
            </div>
            ${s.loading && html`
              <div role="status" style="padding:48px 20px;text-align:center;border-top:1px solid var(--line2)" class="muted">Loading ideas…</div>`}
            ${!s.loading && rows.length === 0 && html`
              <div role="status" style="padding:48px 20px;text-align:center;border-top:1px solid var(--line2)">
                <div style="font-weight:600;font-size:16px">No ideas match these filters</div>
                <div class="muted" style="font-size:14px;margin-top:6px">Try another stage, decision or search term.</div>
              </div>`}
          </div>
          <div id="tbl-summary" aria-live="polite" class="muted" style="padding:14px 20px;border-top:1px solid var(--line2);font-size:13px">Showing ${rows.length} of ${ideas.length} ideas · ${s.sort === 'wsjf' ? 'highest WSJF first' : s.sort === 'votes' ? 'most votes first' : s.sort === 'votes_asc' ? 'fewest votes first' : 'newest first'} · one vote per idea, click again to take it back</div>
        </section>
      </main>`;
  }

  renderDrawer() {
    const i = this.state.ideas.find((x) => x.id === this.state.selId);
    if (!i) return null;
    const c = cod(i);
    const sc = wsjf(i);
    const on = (k) => (e) => this.patchSel(k, e.target.value);
    const fib = (id, label, key) => html`
      <div>
        <label class="lbl" for=${id} style="font-size:13px">${label}</label>
        <select id=${id} class="fld" value=${i[key] ? String(i[key]) : ''} onChange=${on(key)}>
          <option value="">—</option>
          ${FIB.map((n) => html`<option value=${String(n)}>${n}</option>`)}
        </select>
      </div>`;
    const h3 = 'margin:18px 0 8px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)';
    return html`
      <div>
        <button type="button" class="backdrop" aria-label="Close details" onClick=${() => this.closeSel()}></button>
        <aside class="drawer" role="dialog" aria-modal="true" aria-label=${'Idea ' + i.id + ': ' + i.title} tabindex="-1" ref=${(el) => { this.drawerEl = el; }} onKeyDown=${(e) => this.trapFocus(e)}>
          <div style="padding:22px 24px;border-bottom:1px solid var(--line2);display:flex;gap:16px;align-items:flex-start;justify-content:space-between">
            <div style="min-width:0">
              <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px">
                <span class="mono" style="font-size:13px;color:#3F4650">${i.id}</span>
                <span class=${'pill s-' + i.stage}><span class="dot"></span>${STAGE[i.stage]}</span>
                <span class=${'pill d-' + i.decision}>${DEC[i.decision]}</span>
              </div>
              <h2 style="margin:0;font-size:21px;font-weight:700;line-height:1.3">${i.title}</h2>
              <div class="muted" style="font-size:14px;margin-top:6px">${i.category} · submitted by ${i.name}${i.team ? ' (' + i.team + ')' : ''} on ${fmt(i.date)}</div>
              <div style="margin-top:12px">${this.renderVote(i, true)}</div>
            </div>
            <button type="button" class="iconbtn" aria-label="Close details" onClick=${() => this.closeSel()}>${Icon.close}</button>
          </div>

          <div style="padding:24px;display:flex;flex-direction:column;gap:26px">
            <section>
              <h3 style=${h3.replace('18px', '0')}>Description</h3>
              <p style="margin:0;font-size:15px;line-height:1.6;white-space:pre-line">${i.description}</p>
              ${i.benefit && html`<h3 style=${h3}>Expected benefit</h3><p style="margin:0;font-size:15px;line-height:1.6;white-space:pre-line">${i.benefit}</p>`}
              ${i.affected && html`<h3 style=${h3}>Affected services / users</h3><p style="margin:0;font-size:15px;line-height:1.6">${i.affected}</p>`}
              <div class="muted" style="font-size:13px;margin-top:14px">Submitter's urgency: ${URG[i.urgency] || '—'}${i.email ? ' · ' + i.email : ''}</div>
            </section>

            <section style="background:var(--soft);border:1px solid var(--line2);border-radius:12px;padding:20px">
              <div style="display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:18px">
                <div style="min-width:0;flex:1 1 200px">
                  <h3 style="margin:0;font-size:16px;font-weight:700">WSJF scoring</h3>
                  <div class="hint" style="margin-top:4px">Weighted Shortest Job First = Cost of Delay ÷ Job Size. Score each factor relative to other ideas on the Fibonacci scale.</div>
                </div>
                <div style="display:flex;gap:16px">
                  <div style="text-align:right"><div class="eyebrow">Cost of delay</div><div class="mono" style="font-size:22px;font-weight:600;margin-top:4px">${c === null ? '—' : c}</div></div>
                  <div style="text-align:right;padding-left:16px;border-left:1px solid var(--line)"><div class="eyebrow">WSJF</div><div class="mono" style="font-size:28px;font-weight:600;color:var(--accent)">${sc === null ? '—' : sc.toFixed(1)}</div></div>
                </div>
              </div>
              <div class="eyebrow" style="margin-bottom:10px">Cost of delay</div>
              <div class="g3">
                ${fib('w-bv', 'User / business value', 'bv')}
                ${fib('w-tc', 'Time criticality', 'tc')}
                ${fib('w-rr', 'Risk reduction / opp. enablement', 'rr')}
              </div>
              <div class="g3" style="margin-top:16px;padding-top:16px;border-top:1px solid var(--line2)">
                ${fib('w-js', 'Job size', 'js')}
                <div class="hint" style="grid-column:span 2;margin-top:0;align-self:end;line-height:1.5">Relative effort, duration and complexity to deliver. Bigger jobs lower the WSJF score.</div>
              </div>
              <div style="margin-top:16px">
                <label class="lbl" for="a-notes" style="font-size:13px">Assessment notes</label>
                <textarea id="a-notes" class="fld" rows="3" placeholder="Feasibility, dependencies, rationale for the decision…" value=${i.notes} onInput=${on('notes')}></textarea>
              </div>
            </section>

            <section>
              <h3 style="margin:0 0 16px;font-size:16px;font-weight:700">Triage &amp; decision</h3>
              <div class="g2">
                <div><label class="lbl" for="t-prio">Priority</label>
                  <select id="t-prio" class="fld" value=${i.priority} onChange=${on('priority')}>
                    <option value="">Not set</option>${Object.keys(PRIO).map((k) => html`<option value=${k}>${PRIO[k]}</option>`)}
                  </select></div>
                <div><label class="lbl" for="t-asg">Assigned person</label>
                  <select id="t-asg" class="fld" value=${i.assignee} onChange=${on('assignee')}>
                    <option value="">Unassigned</option>${ASSIGNEES.map((n) => html`<option value=${n}>${n}</option>`)}
                  </select></div>
                <div><label class="lbl" for="t-stage">Stage</label>
                  <select id="t-stage" class="fld" value=${i.stage} onChange=${on('stage')}>
                    ${Object.keys(STAGE).map((k) => html`<option value=${k}>${STAGE[k]}</option>`)}
                  </select></div>
                <div><label class="lbl" for="t-dec">Decision status</label>
                  <select id="t-dec" class="fld" value=${i.decision} onChange=${on('decision')}>
                    ${Object.keys(DEC).map((k) => html`<option value=${k}>${DEC[k]}</option>`)}
                  </select></div>
              </div>
              <div class="hint" style="margin-top:12px">Changes save as you make them.</div>
            </section>
          </div>

          <div style="margin-top:auto;padding:16px 24px;border-top:1px solid var(--line2);display:flex;justify-content:flex-end">
            <button type="button" class="btn primary" onClick=${() => this.closeSel()}>Done</button>
          </div>
        </aside>
      </div>`;
  }

  render(_, s) {
    /* while the idea panel is open, the page behind it is inert: not clickable, not focusable, hidden from screen readers */
    return html`
      <div inert=${!!s.selId}>
        ${this.renderHeader(s.view)}
        ${s.view === 'assistant' && this.renderAssistant()}
        ${s.view === 'submit' && this.renderSubmit()}
        ${s.view === 'dashboard' && this.renderDashboard()}
        ${s.view === 'about' && this.renderAbout()}
        <footer>Idea Hub demo · WSJF scoring · all names and ideas are fictional.</footer>
      </div>
      ${this.renderDrawer()}`;
  }
}

render(html`<${App} />`, document.getElementById('app'));
</script>
</body>
</html>
